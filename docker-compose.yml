services:
  django:
    build: .
    ports:
      - "7000:7000"
    volumes:
      - ./.env:/app/.env:ro              # 환경변수 (읽기전용)
      - ./config:/app/config             # Django 설정
      - ./support_board:/app/support_board  # Django 앱
      - ./manage.py:/app/manage.py       # manage.py
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "8000:80"
    depends_on:
      - django
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

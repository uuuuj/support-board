# Support Board - Nginx Include Configuration
# 사용법: nginx.conf의 http 또는 server 블록에서 include /path/to/nginx-support-board.conf;

# 프론트엔드 정적 파일 (빌드된 dist 폴더 경로로 수정 필요)
location /board {
    alias /path/to/support-board/frontend/dist;
    try_files $uri $uri/ /board/index.html;
    index index.html;

    # 정적 자산 캐싱
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Django API 프록시
location /support/api {
    proxy_pass http://127.0.0.1:7000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 세션/쿠키 전달
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
}
